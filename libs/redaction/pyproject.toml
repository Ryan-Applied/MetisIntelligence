[project]
name = "ci-redaction"
version = "0.0.1"
description = "Context Intelligence — deterministic secret & PII redaction (stdlib only)"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["redaction"]

[tool.pytest.ini_options]
testpaths = ["tests"]
